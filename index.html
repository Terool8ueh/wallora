<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallora | والورا</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316182a'/%3E%3Cpath d='M12 42c4-10 8-22 12-22s6 8 8 14 4 14 8 14 8-12 12-22' fill='none' stroke='url(%23g)' stroke-width='7' stroke-linecap='round'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%238b7cff'/%3E%3Cstop offset='1' stop-color='%23ff8a5b'/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E">
<meta name="description" content="Wallora – curated wallpapers in every resolution / والورا – والپیپرهای منتخب در همه رزولوشن‌ها">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Inter:wght@400;600;800&family=Aref+Ruqaa:wght@700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4fb;--fg:#181530;--mut:#6b6885;--card:#fff;--bd:#e3e1f0;--ac:#6f5cff;--ac2:#ff8a5b;--gl:rgba(255,255,255,.62);--sh:0 10px 30px rgba(60,40,140,.12);--r:18px;--f:'Vazirmatn','Inter',system-ui,sans-serif}
[data-theme=dark]{--bg:#0d0e1d;--fg:#f0eefc;--mut:#9b98b8;--card:#171830;--bd:#272848;--gl:rgba(24,25,52,.62);--sh:0 10px 30px rgba(0,0,0,.45)}
:lang(en){--f:'Inter','Vazirmatn',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f);line-height:1.7;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));transition:background .3s,color .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
svg{display:block}
.wrap{max-width:1180px;margin:auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);background:var(--gl);border-bottom:1px solid var(--bd)}
.hd{display:flex;align-items:center;gap:12px;padding:10px 0}
.logo{display:flex;align-items:center;gap:10px;font-size:1.9rem;font-weight:700;font-family:'Aref Ruqaa',serif;line-height:1.3;cursor:pointer}
.logo svg{width:36px;height:36px;flex-shrink:0;border-radius:9px}
.logo span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
:lang(en) .logo{font-family:'Playfair Display',serif;font-style:italic;letter-spacing:.5px}
.sb{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:0 14px;max-width:420px;margin-inline-start:auto}
.sb input{flex:1;background:none;border:0;padding:9px 0;outline:0;min-width:0}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--bd);transition:transform .2s}
.ib:hover{transform:scale(1.08)}
.btn{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;padding:10px 20px;border-radius:99px;font-weight:600;transition:transform .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(111,92,255,.4)}
.btn.o{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
nav{display:flex;gap:4px}
nav button{padding:8px 14px;border-radius:99px;color:var(--mut);font-weight:600}
nav button.on,nav button:hover{color:var(--fg);background:var(--card)}
@media(max-width:820px){nav{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--gl);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:24px;justify-content:space-around;padding:6px;z-index:25;box-shadow:var(--sh)}nav button{padding:8px 10px;font-size:.85rem}.hd{flex-wrap:wrap}.sb{order:9;flex-basis:100%;max-width:none}.logo{margin-inline-end:auto}}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center;padding:44px 0 20px}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.25;font-weight:800;margin-bottom:12px}
.hero p{color:var(--mut);font-size:1.08rem;max-width:46ch;margin-bottom:22px}
.stack{position:relative;height:340px}
.stack .card{position:absolute;width:56%;box-shadow:var(--sh)}
.stack .card:nth-child(1){inset-inline-start:0;top:30px;transform:rotate(-6deg);animation:fl 7s ease-in-out infinite}
.stack .card:nth-child(2){inset-inline-end:0;top:0;transform:rotate(5deg);animation:fl 8s ease-in-out -2s infinite}
.stack .card:nth-child(3){inset-inline-start:22%;bottom:0;transform:rotate(-1deg);animation:fl 9s ease-in-out -4s infinite}
@keyframes fl{50%{translate:0 -12px}}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:24px}.stack{height:280px}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.chip{white-space:nowrap;padding:8px 18px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-weight:600;transition:.2s}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
h2{font-size:1.5rem;font-weight:800;margin:26px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--bd)}
.card .th{width:100%;aspect-ratio:16/10;overflow:hidden}
.card .th svg{width:100%;height:100%;transition:transform .5s}
.card:hover .th svg{transform:scale(1.06)}
.card .mt{display:flex;justify-content:space-between;padding:10px 14px;font-size:.92rem}
.card .mt span{color:var(--mut)}
.fv{position:absolute;top:10px;inset-inline-end:10px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff}
.fv.on{background:#ff4d79}.fv.on svg{fill:#fff}
.fv svg{fill:none;stroke:currentColor;stroke-width:2}
.em{text-align:center;color:var(--mut);padding:50px 10px}
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(8,6,24,.55);backdrop-filter:blur(6px);animation:fi .25s}
.ov[hidden]{display:none}
@keyframes fi{from{opacity:0}}
.glass{width:min(460px,100%);max-height:92vh;overflow:auto;background:var(--gl);backdrop-filter:blur(26px) saturate(1.5);border:1px solid rgba(255,255,255,.35);border-radius:26px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.4);position:relative;animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
.glass.big{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.94) translateY(12px);opacity:0}}
.x{position:absolute;top:14px;inset-inline-end:14px}
.glass h3{font-size:1.4rem;margin-bottom:12px;padding-inline-end:44px}
.aurora{position:fixed;inset:0;z-index:-1;background:radial-gradient(40% 40% at 20% 20%,rgba(111,92,255,.25),transparent),radial-gradient(35% 40% at 85% 70%,rgba(255,138,91,.2),transparent)}
.fld{display:block;margin-bottom:12px;font-size:.9rem;color:var(--mut)}
.fld input,.fld select{width:100%;margin-top:4px;padding:11px 14px;border-radius:14px;border:1px solid var(--bd);background:rgba(127,127,160,.12);color:var(--fg);outline:0}
.fld input:focus{border-color:var(--ac)}
.tabs{display:flex;background:rgba(127,127,160,.15);border-radius:99px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:8px;border-radius:99px;font-weight:600;color:var(--mut)}
.tabs .on{background:var(--card);color:var(--fg)}
.err{color:#ff5470;min-height:1.5em;font-size:.88rem;margin-bottom:6px}
.pv{border-radius:18px;overflow:hidden;margin-bottom:14px;aspect-ratio:16/9}.pv svg{width:100%;height:100%}
.rs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:12px 0}
.rs button{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);transition:.2s}
.rs button:hover{border-color:var(--ac);transform:translateY(-2px)}
.rs small{color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.sw{width:50px;height:28px;border-radius:99px;background:var(--bd);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}
.sw.on{background:var(--ac)}.sw.on::after{inset-inline-start:25px}
.seg{display:flex;gap:4px}.seg button{padding:6px 14px;border-radius:99px;border:1px solid var(--bd)}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}.dots i{width:8px;height:8px;border-radius:9px;background:var(--bd);transition:.3s}.dots i.on{width:24px;background:var(--ac)}
.ob{text-align:center;padding:10px 0}.ob b{font-size:2.6rem;display:block}.ob p{color:var(--mut)}
.pg{max-width:760px;padding:40px 0}.pg p{color:var(--mut);font-size:1.08rem;margin-bottom:14px}
.cc{display:grid;gap:12px;margin-top:20px}.cc a{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--bd);color:var(--fg);text-decoration:none;font-weight:600}
.toast{position:fixed;bottom:110px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:99px;z-index:90;opacity:0;pointer-events:none;transition:.3s;translate:0 20px}
.toast.on{opacity:1;translate:0 0}
footer{text-align:center;color:var(--mut);padding:30px 0;font-size:.9rem}
[hidden]{display:none!important}
.noan *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-size:.9rem;color:var(--mut)}
.stat b{color:var(--fg);font-weight:700}
.hero .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;padding:3px 8px;border-radius:99px;backdrop-filter:blur(6px);pointer-events:none;z-index:2}
.card{position:relative}
.card .th{overflow:hidden}
.card:hover .th img,.card:hover .th svg{transform:scale(1.04)}
.card .th img,.card .th svg{transition:transform .35s ease;width:100%;height:100%;object-fit:cover}
.fv{transition:transform .2s}
.fv.on{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
#toTop{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));inset-inline-end:16px;z-index:15;width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .2s;font-size:1.2rem}
#toTop.show{opacity:1;pointer-events:auto}
#toTop:hover{transform:translateY(-3px)}


/* Category slideshow */
.cat-slide-wrap{position:relative;margin:8px 0 22px;border-radius:22px;overflow:hidden;border:1px solid var(--bd);box-shadow:var(--sh);background:var(--card)}
.cat-slide{position:relative;height:min(52vw,340px);min-height:220px}
.cat-slide .slide{
  position:absolute;inset:0;opacity:0;transform:scale(1.08);
  transition:opacity .8s ease,transform 6s ease;
  pointer-events:none;
}
.cat-slide .slide.on{opacity:1;transform:scale(1);pointer-events:auto;z-index:1}
.cat-slide .slide img,.cat-slide .slide .th{
  width:100%;height:100%;object-fit:cover;display:block;
}
.cat-slide .slide .shade{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(6,5,18,.85) 100%);
  z-index:2;pointer-events:none;
}
.cat-slide .slide .cap{
  position:absolute;bottom:18px;inset-inline-start:18px;inset-inline-end:18px;z-index:3;
  color:#fff;font-weight:700;font-size:1.15rem;
  text-shadow:0 2px 12px rgba(0,0,0,.5);
  transform:translateY(12px);opacity:0;transition:transform .5s ease .15s,opacity .5s ease .15s;
}
.cat-slide .slide.on .cap{transform:none;opacity:1}
.cat-slide .navs{position:absolute;inset-inline:10px;top:50%;transform:translateY(-50%);z-index:4;display:flex;justify-content:space-between;pointer-events:none}
.cat-slide .navs button{
  pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);color:#fff;
  cursor:pointer;font-size:1.1rem;transition:background .2s,transform .2s;
}
.cat-slide .navs button:hover{background:rgba(255,255,255,.3);transform:scale(1.05)}
.cat-dots{display:flex;gap:6px;justify-content:center;padding:10px;position:absolute;bottom:8px;left:0;right:0;z-index:4}
.cat-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:width .3s,background .3s}
.cat-dots i.on{width:20px;border-radius:99px;background:#fff}
.cat-slide-wrap .label{
  position:absolute;top:14px;inset-inline-start:14px;z-index:4;
  padding:6px 12px;border-radius:99px;font-size:.8rem;font-weight:600;
  background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;
  box-shadow:0 6px 20px rgba(111,92,255,.35);
}
@keyframes slideInSoft{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#res .grid{animation:slideInSoft .45s ease both}

</style>
</head>
<body>
<div class="aurora"></div>
<header><div class="wrap hd">
<div class="logo" id="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#16182a"/><path d="M12 42c4-10 8-22 12-22s6 8 8 14 4 14 8 14 8-12 12-22" fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 46c3-8 7-18 10-18s5 6 7 12 4 12 7 12 7-10 10-18" fill="none" stroke="url(#g2)" stroke-width="5" stroke-linecap="round" opacity=".85"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#ff8a5b"/></linearGradient><linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs></svg><span id="logoText">والورا</span></div>
<label class="sb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" data-ph="search" autocomplete="off"></label>
<button class="ib" id="bSet" data-al="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<button class="btn" id="bAcc"></button>
<nav id="nav"></nav>
</div></header>

<main class="wrap">
<section data-v="home">
<div class="hero" id="hero"><div><h1 data-t="h1"></h1><p data-t="h1s"></p><div class="btn-row"><button class="btn" id="cta" data-t="explore"></button><button class="btn o" id="btnRandom" data-t="random"></button></div><div class="stats"><span class="stat" id="statCount"><b>—</b> <span data-t="count"></span></span></div></div><div class="stack" id="stack" aria-hidden="true"></div></div>
<div class="chips" id="chips" role="tablist"></div>
<div id="home"><h2 data-t="trend"></h2><div class="grid" id="gT"></div><h2 data-t="newest"></h2><div class="grid" id="gN"></div></div>
<div id="res" hidden>
<div class="cat-slide-wrap" id="catSlideWrap" hidden>
  <div class="label" id="catSlideLabel"></div>
  <div class="cat-slide" id="catSlide"></div>
  <div class="navs"><button type="button" id="catPrev" aria-label="prev">‹</button><button type="button" id="catNext" aria-label="next">›</button></div>
  <div class="cat-dots" id="catDots"></div>
</div>
<h2 data-t="results"></h2>
<div class="grid" id="gR"></div>
</div>
</section>
<section data-v="saved" hidden><h2 data-t="savedT"></h2><div id="sv"></div></section>
<section data-v="about" hidden class="pg"><h2 data-t="aboutT"></h2><p data-t="aboutP"></p></section>
<section data-v="contact" hidden class="pg"><h2 data-t="contactT"></h2><p data-t="contactP"></p><div class="cc"><a href="mailto:Supportwallora.wallpeper@gmail.com">✉️ <span dir="ltr">Supportwallora.wallpeper@gmail.com</span></a></div></section>
</main>
<footer>© <span id="yr"></span> Wallora · <a href="mailto:Supportwallora.wallpeper@gmail.com" style="color:inherit"><span dir="ltr">Supportwallora.wallpeper@gmail.com</span></a></footer>

<div class="ov" id="mDl" hidden><div class="glass big" role="dialog" aria-modal="true"><button class="ib x" data-close data-al="close">✕</button><div class="pv" id="dlPv"></div><h3 id="dlT"></h3><div class="rs" id="dlR"></div><button class="btn o" id="dlS"></button></div></div>

<div class="ov" id="mAuth" hidden><div class="glass" role="dialog" aria-modal="true"><button class="ib x" data-close data-al="close">✕</button><div class="tabs"><button id="tL" class="on" data-t="login"></button><button id="tR" data-t="register"></button></div>
<label class="fld" id="fN" hidden><span data-t="name"></span><input id="aN" autocomplete="name"></label>
<label class="fld"><span data-t="email"></span><input id="aE" type="email" autocomplete="email" dir="ltr"></label>
<label class="fld"><span data-t="pass"></span><input id="aP" type="password" autocomplete="current-password" dir="ltr"></label>
<div class="err" id="aErr" role="alert"></div>
<button type="button" class="btn o" id="aForgot" style="width:100%;margin-top:8px;background:transparent;border:0;color:var(--mut);font-size:.9rem;cursor:pointer;display:none"></button>
<div id="forgotBox" hidden style="margin-top:10px">
  <p class="mut" id="forgotHint" style="font-size:.9rem;margin-bottom:8px"></p>
  <button class="btn" style="width:100%" id="aForgotGo"></button>
</div>
<div id="resetBox" hidden style="margin-top:10px">
  <label class="fld"><span id="resetLab"></span><input id="aNewP" type="password" dir="ltr" autocomplete="new-password"></label>
  <button class="btn" style="width:100%;margin-top:8px" id="aResetGo"></button>
</div>
<button class="btn" style="width:100%" id="aGo"></button></div></div>

<div class="ov" id="mSet" hidden><div class="glass" role="dialog" aria-modal="true"><button class="ib x" data-close data-al="close">✕</button><h3 data-t="settings"></h3>
<div class="row"><span data-t="lang"></span><div class="seg" id="sL"><button data-l="fa">فارسی</button><button data-l="en">English</button></div></div>
<div class="row"><span data-t="dark"></span><button class="sw" id="sT" role="switch" data-al="dark"></button></div>
<div class="row"><span data-t="anim"></span><button class="sw" id="sA" role="switch" data-al="anim"></button></div>
<div class="row"><span data-t="defq"></span><select id="sQ" class="fld" style="margin:0;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--bd)"></select></div>

        const c=document.createElement('canvas');c.width=a;c.height=b;
        const ctx=c.getContext('2d');
        // cover fit
        const scale=Math.max(a/img.width,b/img.height);
        const sw=a/scale,sh=b/scale,sx=(img.width-sw)/2,sy=(img.height-sh)/2;
        ctx.drawImage(img,sx,sy,sw,sh,0,0,a,b);
        c.toBlob(bl=>{
          const u=URL.createObjectURL(bl),l=document.createElement('a');
          l.href=u;l.download=`wallora-${w.id}-${a}x${b}.png`;
          document.body.appendChild(l);l.click();l.remove();
          setTimeout(()=>URL.revokeObjectURL(u),4000);toast(t('dlOk'));
        },'image/png');
      }catch(e){toast(t('dlErr'))}
    };
    img.onerror=()=>{
      // fallback: open original
      const l=document.createElement('a');l.href=w.image_url;l.download=`wallora-${w.id}.jpg`;l.target='_blank';l.click();toast(t('dlOk'));
    };
    img.src=w.image_url;
    return;
  }
  const img=new Image();
  img.onload=()=>{try{const c=document.createElement('canvas');c.width=a;c.height=b;c.getContext('2d').drawImage(img,0,0,a,b);c.toBlob(bl=>{const u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download=`wallora-${w.c}-${w.id+1}-${a}x${b}.png`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(t('dlOk'))},'image/png')}catch(e){toast(t('dlErr'))}};
  img.onerror=()=>toast(t('dlErr'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(art(w,'d',a,b));
}
async function fav(id){
  if(!me){ toast(t('needLogin')); mode='login'; ui(); show('#mAuth'); return; }
  const isSaved = savedIds.includes(id);
  const token = localStorage.getItem('wl_token');
  try {
    await fetch(API + '/favorites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ wallpaper_id: id, action: isSaved ? 'remove' : 'add' })
    });
    if(isSaved){ savedIds = savedIds.filter(x => x !== id); toast(t('unsaved')); }
    else { savedIds.push(id); toast(t('saved1')); }
    render(); if(open === id) dl(id);
  } catch(e) { toast('خطا در ذخیره'); }
}
async function auth(){
  const n = $('#aN').value.trim();
  const e = $('#aE').value.trim().toLowerCase();
  const p = $('#aP').value;
  const er = $('#aErr');
  er.textContent = '';
  if(!/^\S+@\S+\.\S+$/.test(e)) return er.textContent = t('eBad');
  if(p.length < 6) return er.textContent = t('pBad');
  try {
    if(mode === 'register'){
      if(!n) return er.textContent = t('nBad');
      const res = await fetch(API + '/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: n, email: e, password: p })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'خطا');
      me = data.user; localStorage.setItem('wl_token', data.token);
      toast(t('hi') + ' ' + n + ' 👋');
    } else {
      const res = await fetch(API + '/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: e, password: p })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'خطا');
      me = data.user; localStorage.setItem('wl_token', data.token);
      toast(t('hi') + ' ' + data.user.name + ' 👋');
    }
    hide($('#mAuth')); $('#aP').value = '';
    await loadSaves(); ui();
  } catch(err) { er.textContent = err.message; }
}
async function checkUser(){
  const token = localStorage.getItem('wl_token');
  if(!token){ me = null; return; }
  try {
    const decoded = atob(token);
    const [id, email] = decoded.split(':');
    me = { id: parseInt(id), email, name: email.split('@')[0] };
  } catch(e) { me = null; localStorage.removeItem('wl_token'); }
}
async function loadWallpapers(){
  try {
    const res = await fetch(API + '/wallpapers');
    const data = await res.json();
    const list = data.wallpapers || [];
    if(list.length){
      W = list.map(w => ({
        id: w.id,
        real: true,
        title_fa: w.title_fa,
        title_en: w.title_en,
        category: w.category,
        c: w.category || 'other',
        image_url: w.image_url,
        likes: w.likes || 0,
        device_type: w.device_type || 'all'
      }));
    }
  } catch(e) {
    // keep procedural fallback
    W = [...Wproc];
  }
}
