let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="${Wd}" height="${Ht}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${id}" x1="0" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="${H(0,70,dk?9:66)}"/><stop offset=".6" stop-color="${H(35,72,dk?20:46)}"/><stop offset="1" stop-color="${H(-30,80,dk?32:76)}"/></linearGradient><radialGradient id="r${id}"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="1000" fill="url(#g${id})"/>`;
const glow=(x,y,rr,o)=>`<circle cx="${x}" cy="${y}" r="${rr}" fill="url(#r${id})" opacity="${o}"/>`;
if(k=='nature'){s+=glow(1100,330,260,.9);for(let i=0;i<4;i++){let y=470+i*130,d=`M0 1000V${y}`;for(let x=0;x<=1600;x+=100)d+=`L${x} ${y-r()*170*(1-i*.15)}`;s+=`<path d="${d}V1000Z" fill="${H(i*9,52,44-i*10)}" opacity="${.55+i*.15}"/>`}}
else if(k=='space'){for(let i=0;i<110;i++)s+=`<circle cx="${r()*1600}" cy="${r()*1000}" r="${r()*2.4+.4}" fill="#fff" opacity="${r()*.8+.2}"/>`;s+=glow(1080,430,330,.35)+`<circle cx="1080" cy="430" r="150" fill="${H(60,70,55)}"/><circle cx="1030" cy="390" r="120" fill="${H(0,70,40)}" opacity=".6"/><ellipse cx="1080" cy="450" rx="290" ry="42" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="7" transform="rotate(-18 1080 450)"/>`}
else if(k=='abstract'){for(let i=0;i<6;i++)s+=`<circle cx="${r()*1600}" cy="${r()*1000}" r="${150+r()*260}" fill="${H(i*50,85,58)}" opacity=".38"/>`;s+=glow(500,300,420,.35)}
else if(k=='minimal'){s+=`<circle cx="800" cy="470" r="${170+w.m*25}" fill="#fff" opacity=".88"/><rect x="560" y="760" width="480" height="6" rx="3" fill="#fff" opacity=".6"/>`}
else if(k=='dark'){s+=glow(800,520,560,.28);for(let i=0;i<9;i++)s+=`<path d="M${i*220-300} 1000L${i*220+350} 0" stroke="#fff" stroke-opacity=".06" stroke-width="${8+r()*40}"/>`;s+=`<circle cx="800" cy="500" r="${120+w.m*18}" fill="none" stroke="${H(60,90,65)}" stroke-width="5" opacity=".9"/>`}
else if(k=='anime'){s+=glow(800,380,300,.8)+`<circle cx="800" cy="380" r="170" fill="#fff" opacity=".9"/>`;let x=0;while(x<1600){const bw=70+r()*90,bh=140+r()*300;s+=`<rect x="${x}" y="${1000-bh}" width="${bw}" height="${bh}" fill="${H(20,45,14+r()*8)}"/>`;for(let j=0;j<4;j++)s+=`<rect x="${x+12}" y="${1000-bh+20+j*46}" width="10" height="14" fill="#ffd37a" opacity="${r()>.5?.9:.1}"/>`;x+=bw}for(let i=0;i<28;i++)s+=`<ellipse cx="${r()*1600}" cy="${r()*700}" rx="9" ry="5" fill="#ffc2dd" opacity=".85" transform="rotate(${r()*180} 0 0)"/>`}
else{s+=glow(800,470,380,.6)+`<path d="M0 1000V560H1600V1000Z" fill="${H(0,30,10)}"/><path d="M640 560H960L1500 1000H100Z" fill="${H(0,20,15)}"/>`;for(let i=0;i<5;i++)s+=`<path d="M${790-i*.4} ${590+i*70}h${20+i*8}l${6+i*6} 40h-${32+i*20}z" fill="#fff" opacity=".7"/>`;s+=`<g transform="translate(650 700)"><path d="M0 90L40 40L110 10H210L270 45L300 90V110H0Z" fill="${H(0,85,50)}"/><circle cx="70" cy="112" r="26" fill="#111"/><circle cx="235" cy="112" r="26" fill="#111"/></g>`;for(let i=0;i<10;i++)s+=`<rect x="${r()*1400}" y="${620+r()*300}" width="${120+r()*200}" height="3" fill="#fff" opacity=".25"/>`}
return s+'</svg>'}
// state
let lang=ls.g('wl_lang','fa'),theme=ls.g('wl_theme',matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'),anim=ls.g('wl_anim',true),defq=ls.g('wl_q',2),view='home',cat='all',open=null;
let users=ls.g('wl_users',{}),me=ls.g('wl_me',null),mode='login';
const t=k=>T[lang][k];
const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove('on'),2200)};
const saves=()=>me&&users[me]?users[me].saves:[];
const heart='<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></svg>';
function card(w,p){const on=saves().includes(w.id);return `<div class="card"><button class="th" data-o="${w.id}" style="display:block" aria-label="${title(w,lang)}">${art(w,p,800,500)}</button><button class="fv ${on?'on':''}" data-f="${w.id}" aria-pressed="${on}" aria-label="${t('save')}">${heart}</button><div class="mt"><b>${title(w,lang)}</b><span>♥ ${w.likes.toLocaleString(lang=='fa'?'fa-IR':'en-US')}</span></div></div>`}
const grid=(el,list,p)=>{$(el).innerHTML=list.length?list.map(w=>card(w,p)).join(''):`<div class="em" style="grid-column:1/-1">${t('none')}</div>`};
function render(){
const q=$('#q').value.trim().toLowerCase();
$('#chips').innerHTML=[['all',t('all')],...C.map(c=>[c[0],c[lang=='fa'?1:2]])].map(c=>`<button class="chip ${cat==c[0]?'on':''}" data-c="${c[0]}">${c[1]}</button>`).join('');
const f=W.filter(w=>(cat=='all'||w.c==cat)&&(!q||(title(w,'fa')+' '+title(w,'en')).toLowerCase().includes(q)));
const flt=q||cat!='all';$('#home').hidden=flt;$('#res').hidden=!flt;$('#hero').hidden=!!flt;
if(flt)grid('#gR',f,'r');else{grid('#gT',[...W].sort((a,b)=>b.likes-a.likes).slice(0,8),'t');grid('#gN',[...W].reverse().slice(0,8),'n')}
$('#stack').innerHTML=[W[2],W[9],W[22]].map(w=>`<div class="card"><div class="th">${art(w,'h',800,500)}</div></div>`).join('');
renderSaved()}
function renderSaved(){const el=$('#sv');if(!me){el.innerHTML=`<div class="em">${t('loginFirst')}<br><br><button class="btn" id="svL">${t('login')}</button></div>`;return}
const l=W.filter(w=>saves().includes(w.id));el.innerHTML=`<p style="color:var(--mut);margin-bottom:12px">${t('hi')} ${users[me].name} 👋</p>`+(l.length?`<div class="grid">${l.map(w=>card(w,'s')).join('')}</div>`:`<div class="em">${t('savedE')}</div>`)}
function ui(){
const h=document.documentElement;h.lang=lang;h.dir=lang=='fa'?'rtl':'ltr';h.dataset.theme=theme;document.body.classList.toggle('noan',!anim);
$('#logo').textContent=lang=='fa'?'والورا':'Wallora';document.title=lang=='fa'?'والورا | Wallora':'Wallora';
$$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));$$('[data-al]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.al)));
$('#nav').innerHTML=['home','saved','about','contact'].map(v=>`<button data-v="${v}" class="${v==view?'on':''}">${t(v)}</button>`).join('');
$('#bAcc').textContent=me?users[me].name.split(' ')[0]:t('login');
$('#bOut').hidden=!me;
$$('#sL button').forEach(b=>b.classList.toggle('on',b.dataset.l==lang));
$('#sT').classList.toggle('on',theme=='dark');$('#sT').setAttribute('aria-checked',theme=='dark');$('#sA').classList.toggle('on',anim);$('#sA').setAttribute('aria-checked',anim);
$('#sQ').innerHTML=RES.map((r,i)=>`<option value="${i}" ${i==defq?'selected':''}>${t('rs')[i]} · ${r[0]}×${r[1]}</option>`).join('');
$('#aGo').textContent=t(mode);$('#fN').hidden=mode!='register';$('#tL').classList.toggle('on',mode=='login');$('#tR').classList.toggle('on',mode=='register');
render();if(open!==null)dl(open)}
function go(v){view=v;$$('[data-v]').forEach(e=>{if(e.tagName=='SECTION')e.hidden=e.dataset.v!=v});$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));scrollTo({top:0});if(v=='saved')renderSaved()}
const show=id=>{const e=$(id);e.hidden=false;const b=e.querySelector('button,input');b&&b.focus()};
const hide=e=>{e.hidden=true;if(e.id=='mDl')open=null};
function dl(id){open=id;const w=W[id],on=saves().includes(id);$('#dlPv').innerHTML=art(w,'m',1280,720);$('#dlT').textContent=title(w,lang);
$('#dlR').innerHTML=RES.map((r,i)=>`<button data-d="${i}"><span>⬇ ${t('download')} · ${t('rs')[i]}</span><small dir="ltr">${r[0]}×${r[1]}</small></button>`).join('');
$('#dlS').textContent=(on?'♥ '+t('unsave'):'♡ '+t('save'));$('#mDl').hidden=false}
function download(i){const w=W[open],[a,b]=RES[i],img=new Image();
img.onload=()=>{try{const c=document.createElement('canvas');c.width=a;c.height=b;c.getContext('2d').drawImage(img,0,0,a,b);c.toBlob(bl=>{const u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download=`wallora-${w.c}-${w.id+1}-${a}x${b}.png`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(t('dlOk'))},'image/png')}catch(e){toast(t('dlErr'))}};
img.onerror=()=>toast(t('dlErr'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(art(w,'d',a,b))}
function fav(id){if(!me){toast(t('needLogin'));mode='login';ui();show('#mAuth');return}
const u=users[me],i=u.saves.indexOf(id);i<0?u.saves.push(id):u.saves.splice(i,1);ls.s('wl_users',users);toast(i<0?t('saved1'):t('unsaved'));render();if(open===id)dl(id)}
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('wl:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}}
async function auth(){const n=$('#aN').value.trim(),e=$('#aE').value.trim().toLowerCase(),p=$('#aP').value,er=$('#aErr');er.textContent='';
if(!/^\S+@\S+\.\S+$/.test(e))return er.textContent=t('eBad');
if(mode=='register'){if(!n)return er.textContent=t('nBad');if(p.length<6)return er.textContent=t('pBad');if(users[e])return er.textContent=t('eUsed');users[e]={name:n,h:await hash(p),saves:[]}}
else{if(!users[e]||users[e].h!==await hash(p))return er.textContent=t('eWrong')}
me=e;ls.s('wl_users',users);ls.s('wl_me',me);hide($('#mAuth'));$('#aP').value='';ui();toast(t('hi')+' '+users[e].name+' 👋')}
// onboarding
let ob=0;function obR(){const s=OB[ob];$('#obB').innerHTML=`<b>${s[0]}</b><h3 style="padding:0;margin:8px 0">${s[1]}</h3><p>${s[2]}</p>`;$('#obD').innerHTML=OB.map((_,i)=>`<i class="${i==ob?'on':''}"></i>`).join('');$('#obN').textContent=ob==OB.length-1?'شروع کنید':'بعدی'}
const obOpen=()=>{ob=0;obR();show('#mOn')},obEnd=()=>{hide($('#mOn'));ls.s('wl_seen',1)};
// events
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);let x;
if(x=g('[data-f]'))return fav(+x.dataset.f);
if(x=g('[data-o]'))return dl(+x.dataset.o);
if(x=g('[data-c]')){cat=x.dataset.c;return render()}
if(x=g('[data-d]'))return download(+x.dataset.d);
if(x=g('#nav [data-v]'))return go(x.dataset.v);
if(x=g('[data-l]')){lang=x.dataset.l;ls.s('wl_lang',lang);return ui()}
if(x=g('[data-close]'))return hide(x.closest('.ov'));
if(e.target.classList.contains('ov')&&e.target.id!='mOn')hide(e.target)});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$$('.ov:not([hidden])').forEach(o=>o.id!='mOn'&&hide(o))});
$('#logo').onclick=()=>{cat='all';$('#q').value='';go('home');render()};
$('#q').oninput=()=>{if(view!='home')go('home');render()};
$('#cta').onclick=()=>$('#chips').scrollIntoView({behavior:'smooth'});
$('#bSet').onclick=()=>show('#mSet');
$('#bAcc').onclick=()=>me?go('saved'):(mode='login',ui(),show('#mAuth'));
$('#bOut').onclick=()=>{me=null;ls.s('wl_me',null);hide($('#mSet'));ui();go('home')};
$('#sT').onclick=()=>{theme=theme=='dark'?'light':'dark';ls.s('wl_theme',theme);ui()};
$('#sA').onclick=()=>{anim=!anim;ls.s('wl_anim',anim);ui()};
$('#sQ').onchange=e=>{defq=+e.target.value;ls.s('wl_q',defq)};
$('#sTour').onclick=()=>{hide($('#mSet'));obOpen()};
$('#tL').onclick=()=>{mode='login';$('#aErr').textContent='';ui()};$('#tR').onclick=()=>{mode='register';$('#aErr').textContent='';ui()};
$('#aGo').onclick=auth;$('#mAuth').addEventListener('keydown',e=>{if(e.key=='Enter')auth()});
$('#dlS').onclick=()=>fav(open);
document.addEventListener('click',e=>{if(e.target.id=='svL'){mode='login';ui();show('#mAuth')}});
$('#obN').onclick=()=>{ob<OB.length-1?(ob++,obR()):obEnd()};$('#obS').onclick=obEnd;
$('#yr').textContent=new Date().getFullYear();
if(me&&!users[me]){me=null;ls.s('wl_me',null)}
ui();
if(!ls.g('wl_seen',0))setTimeout(obOpen,600);
})();
</script>
</body>
</html>
